name: LeadRadar Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: leadradar-worker
  cancel-in-progress: true

jobs:
  notify-hot-leads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run LeadRadar worker
        run: pnpm track
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
          MIN_SCORE: ${{ secrets.MIN_SCORE }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DRY_RUN: "false"